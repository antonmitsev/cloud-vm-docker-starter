services:
  sqlite_probe:
    image: node:26-alpine
    profiles: [local]
    entrypoint: [node, /probe.mjs]
    volumes:
      - type: bind
        source: ./local/sqlite_probe.mjs
        target: /probe.mjs
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${DATA_ROOT:?Set DATA_ROOT in local.env}/sqlite-probe
        target: /data
        bind:
          create_host_path: false
      - type: bind
        source: ${DATA_ROOT:?Set DATA_ROOT in local.env}/backups
        target: /backups
        bind:
          create_host_path: false
