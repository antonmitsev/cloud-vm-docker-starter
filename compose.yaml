services:
  gateway:
    image: caddy:2
    restart: unless-stopped
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?Set APP_DOMAIN in .env}
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${HTTP_HOST_PORT:-80}:80"
      - "${BIND_ADDRESS:-0.0.0.0}:${HTTPS_HOST_PORT:-443}:${HTTPS_CONTAINER_PORT:-443}"
    volumes:
      - type: bind
        source: ./Caddyfile
        target: /etc/caddy/Caddyfile
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${DATA_ROOT:-/srv/cloud-app-data}/caddy
        target: /data
        bind:
          create_host_path: false
      - type: bind
        source: ${DATA_ROOT:-/srv/cloud-app-data}/caddy-config
        target: /config
        bind:
          create_host_path: false
